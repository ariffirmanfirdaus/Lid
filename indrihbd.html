<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday mbak indri</title>
<link rel="stylesheet" href="https://rawcdn.githack.com/ariffirmanfirdaus/Lid/f86a07b5ce81f6c1b897eee356046ed804c07aac/hbdi.css">
</head>

<body>

<button id="musicBtn">🔊 Musik ON</button>

<audio id="bgMusic" loop>
    <source src="https://rawcdn.githack.com/ariffirmanfirdaus/Hbdo/9ed6aeb5b3e097a91f01de7a41f8c8c8eb9d30fa/Best%20Happy%20Birthday%20Song%F0%9F%8C%88%20Colorful%20Birthday%20Video.mp3" type="audio/mpeg">
</audio>

<div id="confetti"></div>
<div id="hearts"></div>

<section id="welcome">
    <h1>🎁 Hadiah Spesial 🎁</h1>
    <p>Untuk seseorang yang sangat istimewa...</p>
    <button id="openBtn">Buka Hadiah</button>
</section>

<section id="mainContent" class="hidden">

    <div class="hero">

    <div class="age">29</div>

    <div class="birthday-row">

        <img
        src="https://rawcdn.githack.com/ariffirmanfirdaus/Hbdo/818acab0886bde37b2ac23b086c132ffb365ac15/1780849797234.png"
        class="side-kitty">

        <div class="hero-center">
            <h1>Happy Birthday</h1>
            <h2>Mbak Indri</h2>
        </div>

        <img
        src="https://rawcdn.githack.com/ariffirmanfirdaus/Hbdo/818acab0886bde37b2ac23b086c132ffb365ac15/1780849797234.png"
        class="side-kitty">

    </div>

</div>

    <div class="cake-section">
        <div id="candle">🕯️</div>
        <div class="cake">🎂</div>
        <button id="blowBtn">Tiup Lilin</button>
        <p id="wishResult"></p>
    </div>

    <div class="letter">
    <h3>💌 Surat Digital</h3>

    <p id="typedLetter"></p>

    <button id="startLetterBtn">
        ✨ Baca Surat
    </button>
</div> 

    <div class="stars-section">
        <h3>⭐ 29 Bintang Harapan ⭐</h3>
        <div id="stars"></div>
    </div>

</section>

<script src="https://rawcdn.githack.com/ariffirmanfirdaus/Lid/f86a07b5ce81f6c1b897eee356046ed804c07aac/hbdd.js"></script>
</body>
</html>
